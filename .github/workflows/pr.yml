name: build

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  style:
    name: style and provenance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Document style
        run: ./gradlew checkDocumentStyle

      - name: Reject data files from the original game
        run: |
          matches=$(git ls-files | grep -Ei '\.(ban|ces|cfg|bcf|s22|sbck)$' || true)
          if [ -n "$matches" ]; then
            echo "These belong to the original game and must not be committed:"
            echo "$matches"
            exit 1
          fi

      - name: Reject decompiler artefacts outside the spec
        run: |
          matches=$(git grep -nE '\bbest\.[a-zA-Z]|\be\.t\b|\bfI\(\)|sL\[' \
            -- ':!spec/**' ':!docs/**' ':!.github/**' ':!CONTRIBUTING.md' || true)
          if [ -n "$matches" ]; then
            echo "Looks like decompiler output. Code is written from spec/ only:"
            echo "$matches"
            exit 1
          fi

  check:
    name: build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check
        run: ./gradlew check --stacktrace

      - name: Summarise tests
        if: always()
        run: |
          {
            echo "| Suite | Tests | Failures |"
            echo "|---|---:|---:|"
          } >> "$GITHUB_STEP_SUMMARY"
          find . -name 'TEST-*.xml' -path '*/test-results/*' | sort | while read -r f; do
            name=$(grep -o 'name="[^"]*"' "$f" | head -1 | cut -d'"' -f2)
            tests=$(grep -o 'tests="[0-9]*"' "$f" | head -1 | cut -d'"' -f2)
            failures=$(grep -o 'failures="[0-9]*"' "$f" | head -1 | cut -d'"' -f2)
            echo "| $name | $tests | $failures |" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/**'
          retention-days: 7
